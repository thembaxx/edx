name: Quality checks

on:
  push:
    branches: [main, "feat/nextjs-pnpm-migration-20261022"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.14.0 --no-audit --no-fund
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Oxlint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test
      - name: Next.js production build
        run: pnpm build
      - name: Format, verify and emit generated source snapshots
        run: |
          pnpm run format
          pnpm run format:check
          echo "__EDX_LOCK_BEGIN__"
          cat pnpm-lock.yaml
          echo "__EDX_LOCK_END__"
          git diff --name-only -- app src scripts next.config.ts | while IFS= read -r file; do
            echo "__EDX_FILE_BEGIN__${file}"
            cat "$file"
            echo "__EDX_FILE_END__${file}"
          done
